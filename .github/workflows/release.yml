name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm 10.x crashes on this dependency tree with "Exit handler never
      # called!" (and sometimes even exits 0). npm 11 is stable here, so
      # upgrade first, then install and verify the toolchain really exists.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          if [ ! -x node_modules/.bin/tsc ] || [ ! -x node_modules/.bin/esbuild ]; then
            echo "npm ci did not install devDependencies, retrying with npm install"
            npm install --no-audit --no-fund
          fi
          test -x node_modules/.bin/tsc
          test -x node_modules/.bin/esbuild

      - name: Build
        run: npm run build

      - name: Verify version consistency
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/}
          echo "manifest=$MANIFEST package=$PKG tag=$TAG"
          test "$MANIFEST" = "$PKG"
          # The community directory looks up a release whose tag equals the
          # manifest version, so a "v" prefix would break installation.
          test "$MANIFEST" = "$TAG"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css

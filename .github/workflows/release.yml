name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify version consistency
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/}
          test "$MANIFEST" = "$PKG" || (echo "manifest=$MANIFEST package=$PKG" && exit 1)
          test "$TAG" = "$MANIFEST" || (echo "tag=$TAG manifest=$MANIFEST" && exit 1)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
